{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="page-inner" style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
  <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);">
    <div style="font-size:72px;font-weight:600;color:var(--outline-variant);font-family:'Geist',sans-serif;line-height:1;letter-spacing:-0.03em;">404</div>
    <div class="font-headline-md" style="color:var(--on-surface);">Route Not Found</div>
    <p class="font-body-md text-muted" style="max-width:360px;">The requested BGP path does not resolve to any known endpoint in the IX-Fabric mesh.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="margin-top:var(--space-sm);">
      <span class="material-symbols-outlined">arrow_back</span>
      <span>Return to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}
